name: Update Glade cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published Glade version, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-glade-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Update cask from published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(gh api repos/berkinory/Glade/releases/latest --jq .tag_name)"
            version="${version#v}"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Invalid stable version: $version" >&2
            exit 1
          }

          release="$(gh api "repos/berkinory/Glade/releases/tags/v${version}")"
          [[ "$(jq -r .draft <<< "$release")" == false ]]
          [[ "$(jq -r .prerelease <<< "$release")" == false ]]
          # Installers are versionless from 0.3.1; older releases named them with the version, and the
          # oldest also left out the platform.
          arm_asset="$(jq -ce --arg plain "Glade-macOS-arm64.dmg" --arg versioned "Glade-${version}-macOS-arm64.dmg" \
            --arg legacy "Glade-${version}-arm64.dmg" \
            '[.assets[] | select(.name == $plain or .name == $versioned or .name == $legacy)] | if length == 1 then .[0] else error("Expected one Apple Silicon DMG") end' <<< "$release")"
          arm_digest="$(jq -r .digest <<< "$arm_asset")"
          case "$(jq -r .name <<< "$arm_asset")" in
            "Glade-macOS-arm64.dmg") dmg_prefix="Glade-macOS-" ;;
            "Glade-${version}-macOS-arm64.dmg") dmg_prefix="Glade-#{version}-macOS-" ;;
            *) dmg_prefix="Glade-#{version}-" ;;
          esac
          intel_name="${dmg_prefix//\#\{version\}/$version}x64.dmg"
          intel_digest="$(jq -r --arg name "$intel_name" \
            '.assets[] | select(.name == $name) | .digest' <<< "$release")"
          [[ "$arm_digest" =~ ^sha256:[0-9a-f]{64}$ && "$intel_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Published macOS DMGs are missing SHA-256 digests" >&2
            exit 1
          }
          arm_sha256="${arm_digest#sha256:}"
          intel_sha256="${intel_digest#sha256:}"

          mkdir -p Casks
          cat > Casks/glade.rb <<EOF
          cask "glade" do
            arch arm: "arm64", intel: "x64"

            version "$version"
            sha256 arm: "$arm_sha256", intel: "$intel_sha256"

            url "https://github.com/berkinory/Glade/releases/download/v#{version}/${dmg_prefix}#{arch}.dmg"
            name "Glade"
            desc "All-in-one agentic workspace for coding agents"
            homepage "https://useglade.dev"

            auto_updates true

            app "Glade.app"
          end
          EOF

          ruby -c Casks/glade.rb
          git add Casks/glade.rb
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Glade cask is already current at ${version}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Glade cask to ${version}"
          git push origin HEAD:main
